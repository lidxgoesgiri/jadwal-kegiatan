server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    root /home/site/wwwroot;
    index index.php;
    server_tokens off;
    port_in_redirect off;

    # Berkas konfigurasi, SQL, dokumentasi dan source pendukung bukan halaman publik.
    location ~* ^/(src|views|config|database|docs|azure|certs|tests)(/|$) { deny all; }
    location ~ /\.(?!well-known) { deny all; }
    location = /README.md { deny all; }
    location ~* \.(sql|ini|log|sh)$ { deny all; }

    location / {
        try_files $uri $uri/ =404;
    }
    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_PROXY "";
        fastcgi_read_timeout 60;
    }
}
